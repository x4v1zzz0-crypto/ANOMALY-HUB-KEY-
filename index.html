<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Anomaly Hub Key System</title>
  <style>
    body { background-color: #0b1a3d; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    input, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; }
    button { background-color: #1a73e8; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <h1>ANOMALY HUB KEY SYSTEM</h1>
  <p>Pon tu código de Paypal o tarjeta de regalo</p>
  <input type="text" id="userCode" placeholder="Código">
  <button onclick="verify()">VERIFY</button>
  <p id="result"></p>

  <script>
    async function verify() {
      const code = document.getElementById("userCode").value;
      const res = await fetch("/api/generate-key", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code })
      });
      const data = await res.json();
      if(data.key) {
        document.getElementById("result").innerText = "✅ Tu key: " + data.key;
      } else {
        document.getElementById("result").innerText = "❌ Código inválido";
      }
    }
  </script>
</body>
</html>
