<input type="text" id="userCode" placeholder="Código de pago">
<button onclick="submitCode()">ENVIAR</button>
<button onclick="useKey()">USAR KEY</button>
<p id="result"></p>

<script>
const deviceId = localStorage.getItem("deviceId") || (localStorage.setItem("deviceId", "device-" + Math.random().toString(36).substring(2,10)), localStorage.getItem("deviceId"));

async function submitCode() {
  const code = document.getElementById("userCode").value;
  const result = document.getElementById("result");

  if(!code) return result.innerText = "❌ Pon un código válido";

  result.innerText = "⏳ Enviando para verificación...";

  const res = await fetch("/api/generate-key", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code, deviceId, action: "submit" })
  });

  const data = await res.json();
  if(data.status === "pending") result.innerText = "⏳ Esperando verificación del administrador.";
  else if(data.status === "done") result.innerText = "✅ Tu key ya está lista: " + data.key;
  else result.innerText = "❌ " + data.error;
}

async function useKey() {
  const result = document.getElementById("result");

  const res = await fetch("/api/generate-key", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ deviceId, action: "use" })
  });

  const data = await res.json();
  if(data.key) result.innerText = "✅ Key en uso: " + data.key;
  else result.innerText = "❌ " + data.error;
}

async function releaseKey() {
  const res = await fetch("/api/generate-key", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ deviceId, action: "release" })
  });

  const data = await res.json();
  document.getElementById("result").innerText = data.status || data.error;
}
</script>
